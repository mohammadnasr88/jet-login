{x:-1.2,z:-29,r:1.7,l:"l_note",f:()=>note(3)},
{x:0,z:-33,r:1.8,l:"l_door",f:()=>doors[1].userData.open?0:lockedMsg(),d:1},
{x:1.3,z:-36,r:1.7,l:"l_note",f:()=>note(4)},
{x:0,z:Z1+.4,r:2.4,l:"l_term",f:()=>st.done.tm?0:termUI()}];
function nearest(){let b=null,bd=9;for(const i of IA){if(i.d!=null&&doors[i.d].userData.open)continue;const d=Math.hypot(P.x-i.x,P.z-i.z);if(d<i.r&&d<bd){bd=d;b=i}}return b}

function lockedMsg(){A.err();textModal("l_door",t("doorL"))}
// ---------- modal ----------
let mOpen=false;
function openM(render){mOpen=true;st.run=false;for(const k in keys)keys[k]=0;joy.x=joy.y=0;document.exitPointerLock&&document.exitPointerLock();curRender=()=>{$("mbox").innerHTML=render.html();render.bind&&render.bind()};curRender();$("modal").classList.remove("hide")}
function closeM(){mOpen=false;curRender=null;st.paused=false;$("modal").classList.add("hide");if(!st.over){st.run=true;lockPtr()}}
const closeBtn=()=>`<button class="btn g" id="mc">${t("close")}</button>`;
function textModal(k,m){openM({html:()=>`<h2>${t(k)}</h2><p>${t(k=="l_door"?"doorL":"e")&&m}</p>${closeBtn()}`,bind(){$("mc").onclick=closeM}})}
// terminal
function termUI(){let buf=[];const render={html:()=>`<h2>${t("tmT")}</h2><div class="disp" id="d">${[0,1,2,3].map(i=>buf[i]??"_").join(" ")}</div><div class="msg" id="m">${st.lock>0?t("tmLock",{s:Math.ceil(st.lock)}):t("tmLeft",{n:st.tries})}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn g" data-n="${n}">${n}</button>`).join("")}<button class="btn g" id="cl">${t("clr")}</button><button class="btn g" data-n="0">0</button><button class="btn" id="ok">${t("ok")}</button></div>${closeBtn()}`,
 bind(){const upd=()=>$("d").textContent=[0,1,2,3].map(i=>buf[i]??"_").join(" ");
 document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>add(b.dataset.n));
 const add=n=>{if(buf.length<4&&st.lock<=0){buf.push(+n);A.click();upd()}};termKey=add;
 $("cl").onclick=()=>{buf=[];A.click();upd()};
 $("ok").onclick=async()=>{if(buf.length<4||st.lock>0)return;st.attempts++;if(await Auth.terminal(buf)){st.done.tm=true;A.unlock();win()}else{A.err();buf=[];st.tries--;let m=t("tmBad");if(st.tries<=0){st.lock=15;st.tries=3}upd();$("m").className="msg e";$("m").textContent=m+" "+(st.lock>0?t("tmLock",{s:15}):t("tmLeft",{n:st.tries}))}};
 $("mc").onclick=()=>{termKey=null;closeM()}}};openM(render)}
let termKey=null;
// circuit
function circuitUI(){let sel=-1,conn=[-1,-1,-1];const cols=["#ff4040","#3be08a","#38b6ff"];
 const render={html:()=>{let ln="";conn.forEach((s,i)=>{if(s>=0)ln+=`<line x1="40" y1="${40+i*60}" x2="260" y2="${40+s*60}" stroke="${cols[i]}" stroke-width="5"/>`});
 const nodes=[0,1,2].map(i=>`<circle data-w="${i}" cx="40" cy="${40+i*60}" r="16" fill="${cols[i]}" stroke="${sel==i?"#fff":"#000"}" stroke-width="3"/><circle data-s="${i}" cx="260" cy="${40+i*60}" r="16" fill="#222" stroke="#8aa" stroke-width="3"/><text x="260" y="${45+i*60}" text-anchor="middle">${i+1}</text>`).join("");
 return`<h2>${t("l_power")}</h2><p style="font-size:14px">${t("pwT")}</p><svg viewBox="0 0 300 180" width="100%" style="max-width:360px;background:#02070c;border-radius:8px">${ln}${nodes}</svg><div class="msg" id="m"></div>${closeBtn()}`},
 bind(){$("mc").onclick=closeM;document.querySelectorAll("[data-w]").forEach(n=>n.onclick=()=>{sel=+n.dataset.w;conn[sel]=-1;A.click();curRender()});
 document.querySelectorAll("[data-s]").forEach(n=>n.onclick=async()=>{if(sel<0)return;if(conn.includes(+n.dataset.s))return;conn[sel]=+n.dataset.s;sel=-1;A.click();
 if(conn.every(x=>x>=0)){if(await Auth.circuit(conn)){curRender();$("m").className="msg o";$("m").textContent=t("pwOk");st.done.pw=true;A.ok();A.unlock();powerOn()}else{A.spark();A.err();spark.intensity=6;conn=[-1,-1,-1];curRender();$("m").className="msg e";$("m").textContent=t("pwBad")}}else curRender()})}};openM(render)}
// pressure
function pressureUI(){const v=Auth.m.start.slice();let msg="";
 const render={html:()=>`<h2>${t("l_press")}</h2><p style="font-size:14px">${t("prT")}</p>${[0,1,2].map(i=>{const tg=Auth.m.target[i];return`<div class="row"><button class="btn g" data-v="${i}" data-s="-1">−</button><div class="bar"><div class="band" style="left:${tg-4}%;width:8%"></div><div class="fill" style="width:${Math.max(0,Math.min(100,v[i]))}%"></div></div><button class="btn g" data-v="${i}" data-s="1">+</button><span style="width:70px">${t("valve")} ${"ABC"[i]}</span></div>`}).join("")}<div class="msg ${msg?"o":""}" id="m">${msg}</div>${closeBtn()}`,
 bind(){$("mc").onclick=closeM;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.v,s=+b.dataset.s;v[i]=Math.max(0,Math.min(100,v[i]+s*6));const j=(i+1)%3;v[j]=Math.max(0,Math.min(100,v[j]-s*3));A.click();
 if(await Auth.pressure(v)){st.done.pr=true;A.ok();A.unlock();msg=t("prOk",{d:Auth.m.code[1]});st.got[1]=1;refreshHUD();if(!doors[1].userData.open)doors[1].userData.open=.001;curRender()}else curRender()})}};openM(render)}
function powerOn(){doors[0].userData.open=.001;refreshHUD()}
// ---------- settings / win / fail ----------
function settings(){st.paused=true;openM({html:()=>`<h2>${t("set")}</h2><p>${t("vol")}</p><input type="range" id="vr" min="0" max="100" value="${Math.round(A.v*100)}"><br><br><button class="btn g" id="ll">${t("lang")}</button> <button class="btn" id="mc">${t("resume")}</button>`,bind(){$("vr").oninput=e=>A.setV(e.target.value/100);$("ll").onclick=()=>{L=L=="fa"?"en":"fa";applyLang()};$("mc").onclick=closeM}})}
function win(){st.over=true;const s=Math.round(st.tLeft*10)+Math.max(0,3-st.attempts)*100;endScreen("winH","winT",{t:fmt(st.tLeft),s},"#3be08a")}
function endScreen(h,tx,o,col){termKey=null;openM({html:()=>`<h1 style="color:${col||"var(--red)"}">${t(h)}</h1><p>${t(tx,o)}</p><button class="btn" id="ag">${t("again")}</button>`,bind(){$("ag").onclick=restart}});}
function restart(){mOpen=false;curRender=null;$("modal").classList.add("hide");Auth.reset(seed);Object.assign(st,{over:false,paused:false,tLeft:300,done:{pw:false,pr:false,tm:false},got:[0,0,0,0],lock:0,tries:3,attempts:0,power:0});doors.forEach(d=>{d.userData.open=0;d.position.y=(H-.1)/2;if(!obst.includes(d.userData.o))obst.push(d.userData.o)});P.x=0;P.z=2;P.yaw=P.pitch=0;pscr.material.color.set(0xff3b3b);scr.material.color.set(0xff3b3b);refreshHUD();st.run=true;lockPtr()}
// ---------- HUD ----------
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
function refreshHUD(){const d=st.done;$("obj").textContent=t(!d.pw?"o0":!d.pr?"o1":!d.tm?"o2":"o3");$("prog").innerHTML=[["pw",t("pw")],["pr",t("pr")],["tm",t("tm")]].map(([k,n])=>`<span class="pip ${d[k]?"d":""}">${d[k]?"✔ ":""}${n}</span>`).join("");$("code").textContent=st.got.map(g=>g?"●":"_").join(" ")}
// ---------- input ----------
function lockPtr(){if(!touch&&R.domElement.requestPointerLock)try{R.domElement.requestPointerLock()}catch(e){}}
addEventListener("keydown",e=>{if(termKey&&/^Digit[0-9]$/.test(e.code)){termKey(e.code.slice(5));return}keys[e.code]=1;if(e.code=="KeyE"&&st.run)useIA();if(e.code=="Escape"&&st.run)settings()});
addEventListener("keyup",e=>keys[e.code]=0);
addEventListener("mousemove",e=>{if(document.pointerLockElement){P.yaw-=e.movementX*.0022;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-e.movementY*.0022))}});
const tp={};let sprintT=false;
addEventListener("touchstart",e=>{if(mOpen)return;for(const x of e.changedTouches){if(x.target.closest("button"))continue;tp[x.identifier]={x:x.clientX,y:x.clientY,s:x.clientX<innerWidth/2?"m":"l",ox:x.clientX,oy:x.clientY}}},{passive:true});
addEventListener("touchmove",e=>{for(const x of e.changedTouches){const p=tp[x.identifier];if(!p)continue;if(p.s=="m"){joy.x=Math.max(-1,Math.min(1,(x.clientX-p.ox)/45));joy.y=Math.max(-1,Math.min(1,(x.clientY-p.oy)/45));$("knob").style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`}else{P.yaw-=(x.clientX-p.x)*.005;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(x.clientY-p.y)*.005));p.x=x.clientX;p.y=x.clientY}}},{passive:true});
addEventListener("touchend",e=>{for(const x of e.changedTouches){if(tp[x.identifier]&&tp[x.identifier].s=="m"){joy.x=joy.y=0;$("knob").style.transform=""}delete tp[x.identifier]}},{passive:true});
$("act").addEventListener("click",()=>{if(st.run)useIA()});$("sprint").addEventListener("click",()=>{sprintT=!sprintT;$("sprint").style.borderColor=sprintT?"#38b6ff":""});
function useIA(){const i=nearest();if(i)i.f()}
$("gear").onclick=()=>{if(!mOpen&&!$("intro").classList.contains("hide")==false)settings()};$("lang").onclick=()=>{L=L=="fa"?"en":"fa";applyLang()};
$("start").onclick=()=>{A.init();$("intro").classList.add("hide");st.run=true;lockPtr()};
R.domElement.addEventListener("click",()=>{if(st.run)lockPtr()});
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener("resize",size);size();
// ---------- collision ----------
const PR=.35;const hit=(x,z)=>obst.some(o=>x>o.x0-PR&&x<o.x1+PR&&z>o.z0-PR&&z<o.z1+PR);
let vx=0,vz=0,alarmT=0;const clock=new THREE.Clock();
Auth.reset(seed);applyLang();$("hint").style.display="none";
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;
 if(st.run){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  const run=keys.ShiftLeft||keys.ShiftRight||sprintT,sp=run?5.2:3.0,sn=Math.sin(P.yaw),cs=Math.cos(P.yaw);
  let tx=(-sn*f+cs*s),tz=(-cs*f-sn*s);const l=Math.hypot(tx,tz);if(l>1){tx/=l;tz/=l}
  vx+=(tx*sp-vx)*Math.min(1,dt*10);vz+=(tz*sp-vz)*Math.min(1,dt*10);
  let nx=P.x+vx*dt;if(nx<-1.6||nx>1.6||hit(nx,P.z))nx=P.x;P.x=nx;let nz=P.z+vz*dt;if(nz>Z0||nz<Z1+1.1||hit(P.x,nz))nz=P.z;P.z=nz;
  if(Math.hypot(vx,vz)>.5)P.bob+=dt*(run?13:9);
 }
 if(!st.over&&!st.paused&&!$("intro").classList.contains("hide")==false&&false){}
 if(!st.over&&!st.paused&&$("intro").classList.contains("hide")){st.tLeft-=dt;if(st.lock>0)st.lock-=dt;
  if(st.tLeft<=0){st.tLeft=0;st.over=true;endScreen("failH","failT",{})}
  if(st.tLeft<60&&!st.done.pw||st.tLeft<30){alarmT-=dt;if(alarmT<=0){A.alarm();alarmT=2}}}
 const sprintBob=Math.hypot(vx,vz)>4?.045:.03;C.position.set(P.x,1.6+Math.sin(P.bob)*sprintBob,P.z);C.rotation.set(P.pitch,P.yaw,0,"YXZ");
 // doors
 doors.forEach(d=>{const u=d.userData;if(u.open>0&&u.open<1){u.open=Math.min(1,u.open+dt*.5);d.position.y=(H-.1)/2+u.open*(H-.1);if(u.open>=.5){const k=obst.indexOf(u.o);if(k>=0)obst.splice(k,1)}A.c&&0}});
 // power fade-in
 const tgt=st.done.pw?1:0;st.power+=(tgt-st.power)*dt*1.5;amb.intensity=.9+st.power*.9;
 reds.forEach((l,i)=>{const k=Math.sin(tm*3+i*2)>.2?1:.35;l.intensity=(2.4+Math.sin(tm*6+i)*.4)*k*(st.tLeft<60?1.5:1)*(1-st.power*.55)});
 wl.forEach((l,i)=>{const fl=st.power<.5&&Math.random()<.05?.2:1;l.intensity=(.5+st.power*2)*fl});
 if(spark.intensity>0)spark.intensity=Math.max(0,spark.intensity-dt*20);else if(Math.random()<.004){spark.intensity=5;A.spark()}
 scr.material.color.setHSL(st.done.tm?.38:.55,1,.45+Math.sin(tm*4)*.05);pscr.material.color.set(st.done.pw?0x3be08a:0xff3b3b);prs.material.color.set(st.done.pr?0x3be08a:0xffaa22);
 const n=!mOpen&&st.run?nearest():null;$("hint").style.display=n?"block":"none";if(n)$("hint").textContent=(touch?"":"E · ")+t(n.l);
 $("timer").textContent=fmt(st.tLeft);$("timer").classList.toggle("low",st.tLeft<60);
 R.render(S,C)}
loop()}
